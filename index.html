<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erin 的遊戲樂園</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="portal">
      <header class="portal-header">
        <h1>🌟 Erin 的遊戲樂園 🌟</h1>
        <p>選一個遊戲來玩吧！</p>
      </header>

      <section class="game-grid" id="gameGrid">
        <a href="games/ice-cream-stacker/" class="game-card" style="--card-color: #ff8eb2">
          <span class="game-icon">🍦</span>
          <span class="game-title">冰淇淋甜筒店</span>
          <span class="game-desc">接住冰淇淋球，疊出漂亮甜筒！</span>
        </a>

        <a href="games/mario-like/" class="game-card" style="--card-color: #ef4444">
          <span class="game-icon">🏃</span>
          <span class="game-title">小冒險家</span>
          <span class="game-desc">跳過平台，收集金幣！</span>
        </a>

        <a href="games/rhythm-memory/" class="game-card" style="--card-color: #a78bfa">
          <span class="game-icon">🎮</span>
          <span class="game-title">節奏記憶</span>
          <span class="game-desc">記住順序，照著按一遍！</span>
        </a>

        <a href="games/pet-care/" class="game-card" style="--card-color: #f9a8d4">
          <span class="game-icon">🐱</span>
          <span class="game-title">寵物養成</span>
          <span class="game-desc">餵食、洗澡、玩耍，照顧你的小寵物！</span>
        </a>

        <a href="games/piano/" class="game-card" style="--card-color: #fbbf24">
          <span class="game-icon">🎹</span>
          <span class="game-title">小小鋼琴家</span>
          <span class="game-desc">彈鋼琴，錄下來再播放！</span>
        </a>

        <div class="game-card game-card--empty">
          <span class="game-icon">➕</span>
          <span class="game-title">新遊戲準備中</span>
          <span class="game-desc">等你設計下一个遊戲！</span>
        </div>
      </section>

      <footer class="portal-footer">
        <p>✨ 每個遊戲都是 Erin 自己設計的 ✨</p>
      </footer>
    </main>
  </body>
</html>
