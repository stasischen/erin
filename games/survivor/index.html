<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#142331" />
  <title>小怪獸</title>
  <link rel="stylesheet" href="style.css?v=20261025i" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../../assets/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Erin 的遊戲" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="back" href="../../">‹ 回遊戲樂園</a>
      <h1>👾 小怪獸</h1>
      <button id="pauseButton" class="pause-button" type="button" aria-label="暫停">Ⅱ</button>
    </header>
    <section class="stage" id="stage" aria-label="遊戲畫面">
      <canvas id="gameCanvas" aria-label="藍色水星人在教室躲避甲本"></canvas>
      <div id="bossHud" class="boss-hud" hidden><strong>老師</strong><div class="boss-track"><div id="bossHealthFill" class="boss-health-fill"></div></div></div>
      <div class="hud" aria-live="polite">
        <div class="health-wrap"><span class="health-label">血條</span><div class="health-track"><div id="healthFill" class="health-fill"></div></div></div>
        <div class="experience-wrap"><span class="experience-label">經驗</span><div class="experience-track"><div id="experienceFill" class="experience-fill"></div></div><span id="levelLabel" class="level-label">Lv.1</span></div>
        <span id="status" class="status">準備開始</span>
      </div>
      <div id="buildSlots" class="build-slots" aria-label="本局四欄位"></div>
      <div id="enemyNotice" class="enemy-notice" role="status" hidden></div>
      <div id="actionControls" class="action-controls" hidden aria-label="動作按鈕">
        <button id="skillButton" class="action-button skill-button" type="button"><span>🌀<b>技能</b><small>就緒</small></span></button>
        <button id="dashButton" class="action-button dash-button" type="button"><span>💨<b>衝刺</b><small>就緒</small></span></button>
      </div>
      <div id="overlay" class="overlay">
        <section id="upgradePanel" class="upgrade-panel" hidden aria-label="選擇升級">
          <h2>升級了！選一張卡</h2>
          <p>入門 → A／B → 終極（每場一張）｜卡片最高 Lv5｜按 1、2、3</p>
          <div id="upgradeCards" class="upgrade-cards"></div>
          <details class="tree-details"><summary>查看技能樹與前置條件</summary><div id="skillTree" class="skill-tree"></div></details>
        </section>
        <section id="settingsPanel" class="settings-panel" hidden aria-label="遊戲設定">
          <h2>⚙️ 遊戲設定</h2>
          <p>調整後會自動記住這台裝置的設定。</p>
          <div id="settingsControls" class="settings-controls"></div>
          <div class="settings-toggles">
            <button id="soundToggle" class="settings-action" type="button"></button>
            <button id="vibrationToggle" class="settings-action" type="button"></button>
          </div>
          <div class="settings-actions">
            <button id="resetSettingsButton" class="settings-action" type="button">恢復預設</button>
            <button id="closeSettingsButton" class="settings-action settings-done" type="button">完成</button>
          </div>
        </section>
        <div class="message-card">
          <div id="messageIcon" class="message-icon">🧅</div>
          <h2 id="messageTitle">小怪獸</h2>
          <p id="messageText">用方向鍵、WASD 或手指搖桿移動，躲開甲本！</p>
          <button id="settingsButton" class="settings-action menu-settings" type="button">⚙️ 遊戲設定</button>
          <button id="startButton" class="start-button" type="button">開始遊戲</button>
        </div>
      </div>
    </section>
    <footer class="help">移動：方向鍵／WASD／搖桿　空白鍵：衝刺　E：泡泡炸彈　Esc：暫停</footer>
  </main>
  <script src="game.js?v=20261025i"></script>
  <script src="../../register-sw.js" defer></script>
</body>
</html>
