<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>小飆車手</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <header>
        <h1>🏎️ 小飆車手</h1>
        <p class="status" id="status">閃避來車，吃道具！</p>
      </header>

      <section class="hud">
        <div class="hud-item">❤️ 生命：<span id="lives">3</span></div>
        <div class="hud-item">⭐ 分數：<span id="score">0</span></div>
      </section>

      <section class="arena" id="arena">
        <canvas id="canvas"></canvas>
      </section>

      <section class="controls">
        <button class="start-btn" id="startBtn">▶ 開始遊戲</button>
      </section>

      <section class="touch-controls" id="touchControls">
        <div class="touch-row">
          <div class="touch-btn" id="turnLeft">◀ 左邊</div>
          <div class="touch-btn" id="turnRight">右邊 ▶</div>
        </div>
      </section>

      <p class="hint">💡 點螢幕左半 / 右半也可以控制！</p>

      <a href="../../" class="back-btn">← 回遊戲樂園</a>
    </main>

    <script src="game.js"></script>
  </body>
</html>
