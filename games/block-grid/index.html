<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>方塊格子</title>
    <link rel="stylesheet" href="style.css?v=20261126a" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../../assets/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Erin 的遊戲" />
    <meta name="theme-color" content="#1e212b" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Erin's Arcade</p>
          <h1>方塊格子</h1>
        </div>
        <p class="topbar-subtitle">排好方塊、消除整行，得分衝高高！</p>
      </header>

      <section class="game-layout">
        <section class="play-panel">
          <div class="board-wrap">
            <canvas id="board" width="300" height="600" aria-label="遊戲棋盤"></canvas>
            <div id="overlay" class="overlay">
              <p id="overlayTitle" class="overlay-title">方塊格子</p>
              <p id="overlayText" class="overlay-text">按「開始」來玩！</p>
              <p class="overlay-best">最佳分數 <span id="overlayBest">0</span></p>
            </div>
          </div>

          <section class="controls">
            <button id="startBtn" type="button">開始</button>
            <button id="pauseBtn" type="button" disabled>暫停</button>
            <button id="restartBtn" type="button">重新開始</button>
          </section>

          <section class="touch-controls" aria-label="觸控按鈕">
            <button id="leftBtn" type="button" aria-label="往左移動">← 左</button>
            <button id="rotateBtn" type="button" aria-label="旋轉">⟳ 旋轉</button>
            <button id="rightBtn" type="button" aria-label="往右移動">右 →</button>
            <button id="holdBtn" type="button" aria-label="暫存方塊">暫存</button>
            <button id="softBtn" type="button" aria-label="軟降">↓ 軟降</button>
            <button id="hardBtn" type="button" aria-label="硬降">⤓ 落下</button>
            <button id="pauseTouchBtn" type="button" aria-label="暫停">⏸ 暫停</button>
            <button id="restartTouchBtn" type="button" aria-label="重新開始">↺ 重開</button>
          </section>
        </section>

        <aside class="side-panel">
          <section class="hud" aria-label="遊戲狀態">
            <div class="hud-item hud-item--score">分數 <span id="score">0</span></div>
            <div class="hud-item">最佳 <span id="best">0</span></div>
            <div class="hud-item">行數 <span id="lines">0</span></div>
            <div class="hud-item">等級 <span id="level">1</span></div>
          </section>

          <section class="preview-card" aria-label="暫存方塊">
            <div class="label">暫存（C）</div>
            <canvas id="holdCanvas" width="120" height="90"></canvas>
          </section>

          <section class="preview-card" aria-label="接下來的方塊">
            <div class="label">接下來</div>
            <canvas id="nextCanvas" width="120" height="270"></canvas>
          </section>

          <section class="result" id="resultBox" aria-live="polite">
            <p id="resultText">按開始就出發！</p>
          </section>

          <section class="help">
            <p>鍵盤：← → 移動、↓ 軟降、↑ 或 X 旋轉、空白鍵硬降、C 暫存、P 或 Esc 暫停。</p>
            <p>平板：用棋盤下方的觸控按鈕也可以玩。</p>
          </section>
        </aside>
      </section>
    </main>

    <script src="game.js?v=20261126a"></script>
    <script src="../../register-sw.js" defer></script>
  </body>
</html>
