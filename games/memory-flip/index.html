<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>記憶翻牌</title>
    <link rel="stylesheet" href="style.css?v=20261126a" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../../assets/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Erin 的遊戲" />
    <meta name="theme-color" content="#dff4ff" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Erin's Arcade</p>
          <h1>記憶翻牌</h1>
        </div>
        <p class="topbar-subtitle">翻開牌，找出每一對好朋友！</p>
      </header>

      <section class="panel">
        <div class="difficulty-row" role="group" aria-label="選擇難度">
          <span class="difficulty-label">難度：</span>
          <button type="button" class="diff-btn is-active" data-difficulty="easy">簡單（12 張）</button>
          <button type="button" class="diff-btn" data-difficulty="normal">普通（16 張）</button>
          <button type="button" class="diff-btn" data-difficulty="hard">困難（24 張）</button>
        </div>

        <section class="hud" aria-label="遊戲狀態">
          <div class="hud-item">時間 <span id="timeText">0 秒</span></div>
          <div class="hud-item">翻牌次數 <span id="movesText">0</span></div>
          <div class="hud-item">已配對 <span id="pairsText">0 / 6</span></div>
        </section>
        <p class="moves-note">翻牌次數：每翻兩張算 1 次</p>
        <p class="best-record" id="bestText" aria-live="polite">最佳紀錄：尚無紀錄</p>

        <div id="board" class="board cols-4" aria-label="牌面"></div>

        <section class="controls">
          <button type="button" id="restartBtn">重新開始</button>
        </section>

        <section class="help">
          <p>玩法：點一張牌翻開，再點第二張；兩張一樣就會留住，不一樣會翻回去。把全部牌都配對成功就完成囉！</p>
        </section>
      </section>
    </main>

    <div id="winOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <div class="overlay-card">
        <h2 id="winTitle">🎉 全部配對成功！</h2>
        <p class="stars" id="winStars" aria-label="星等評分">★★★</p>
        <p>用時：<span id="winTime">0</span> 秒</p>
        <p>翻牌次數：<span id="winMoves">0</span> 次（每翻兩張算 1 次）</p>
        <p id="winBest" class="win-best"></p>
        <button type="button" id="playAgainBtn">再玩一次</button>
      </div>
    </div>

    <script src="game.js?v=20261126a"></script>
    <script src="../../register-sw.js" defer></script>
  </body>
</html>
